<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>__APP_TITLE__</title>
<script src="https://unpkg.com/react@18.2.0/umd/react.development.js"></script>
<script src="https://unpkg.com/react-dom@18.2.0/umd/react-dom.development.js"></script>
<script src="https://unpkg.com/@babel/standalone@7.24.7/babel.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lusitana:wght@400;700&family=Noto+Serif:wght@400;600;700&family=Lora:wght@400;500;600;700&family=Inter:wght@400;500;600;700&family=Source+Sans+3:wght@400;500;600;700&display=swap" rel="stylesheet">
<!-- cdn.tailwindcss.com compiles utility classes at runtime in-browser; fine for this
     throwaway single-file mockup, not intended by Tailwind for production use. -->
<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = {
    theme: {
      extend: {
        fontFamily: {
          heading: ['Lusitana', 'Noto Serif', 'Lora', 'serif'],
          body: ['Inter', 'Source Sans 3', 'sans-serif'],
        }
      }
    }
  }
</script>
<style>
  /* Intentionally minimal — do nKn and palette rules in the system prompt. */
  * { box-sizing: border-box; }
  body { margin: 0; }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel" data-presets="react">
const { useState } = React;

/* __ROLES__ */
const ROLES = __ROLES_JSON__;

/* __SCREENS__ — each screen has a visible_to_roles: string[] field naming which
   ROLES entries can see it. Nav and routing below MUST filter by this, not just
   display it — the role selector is a real access filter, not decoration. */
const SCREENS = __SCREENS_JSON__;

/* __FEATURES__ */
const FEATURES = __FEATURES_JSON__;

function ListView({ screen }) {
  const [items, setItems] = useState(
    Array.from({ length: 5 }).map((_, i) => ({ id: i + 1, name: `${screen.name} item ${i + 1}` }))
  );
  return (
    <div>
      <div>
        <h2>{screen.name}</h2>
        <button>+ New</button>
      </div>
      <p>{screen.purpose}</p>
      <table>
        <thead>
          <tr>{(screen.key_elements || ["Name"]).map((k) => <th key={k}>{k}</th>)}</tr>
        </thead>
        <tbody>
          {items.map((item) => (
            <tr key={item.id}>
              {(screen.key_elements || ["Name"]).map((k) => <td key={k}>{item.name} — {k}</td>)}
            </tr>
          ))}
        </tbody>
      </table>
    </div>
  );
}

function FormView({ screen }) {
  return (
    <div>
      <h2>{screen.name}</h2>
      <p>{screen.purpose}</p>
      {(screen.key_elements || ["Field"]).map((k) => (
        <div key={k}>
          <label>{k}</label>
          <input type="text" placeholder={k} />
        </div>
      ))}
      <button>Save</button>
      <button>Cancel</button>
    </div>
  );
}

function DetailView({ screen }) {
  return (
    <div>
      <h2>{screen.name}</h2>
      <p>{screen.purpose}</p>
      {(screen.key_elements || ["Detail"]).map((k) => (
        <div key={k}>
          <label>{k}</label>
          <div>{k} value</div>
        </div>
      ))}
    </div>
  );
}

function screenComponent(screen, index) {
  const kind = index % 3 === 0 ? "list" : index % 3 === 1 ? "form" : "detail";
  if (kind === "list") return <ListView screen={screen} />;
  if (kind === "form") return <FormView screen={screen} />;
  return <DetailView screen={screen} />;
}

function App() {
  const [role, setRole] = useState(ROLES[0]?.name || "");

  // Real access filter, not decoration: only screens whose visible_to_roles
  // includes the current role are ever rendered in nav or as the active screen.
  const visibleScreens = SCREENS.filter((s) => (s.visible_to_roles || []).includes(role));

  const [activeName, setActiveName] = useState(visibleScreens[0]?.name);

  // If switching role drops the previously active screen out of view,
  // fall back to the first screen the new role can actually see.
  const activeScreen =
    visibleScreens.find((s) => s.name === activeName) ||
    visibleScreens[0] ||
    { name: "No screens available for this role", purpose: "", key_elements: [] };

  function handleRoleChange(nextRole) {
    setRole(nextRole);
    const nextVisible = SCREENS.filter((s) => (s.visible_to_roles || []).includes(nextRole));
    setActiveName(nextVisible[0]?.name);
  }

  const activeIndex = SCREENS.findIndex((s) => s.name === activeScreen.name);

  return (
    <div>
      <div>
        <h1>__APP_TITLE__</h1>
        <nav>
          {visibleScreens.map((s) => (
            <a
              key={s.name}
              onClick={() => setActiveName(s.name)}
            >
              {s.name}
            </a>
          ))}
        </nav>
      </div>
      <div>
        <div>
          Role:{" "}
          <select value={role} onChange={(e) => handleRoleChange(e.target.value)}>
            {ROLES.map((r) => (
              <option key={r.name} value={r.name}>{r.name}</option>
            ))}
          </select>
        </div>
        {screenComponent(activeScreen, activeIndex)}
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
